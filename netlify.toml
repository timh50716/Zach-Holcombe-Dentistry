# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep build tooling and docs off the public site.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Old WordPress URLs from dentalasheville.com -> new pages (keeps search rankings and bookmarks).
[[redirects]]
  from = "/about-us/*"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/services/*"
  to = "/services.html"
  status = 301
  force = true

[[redirects]]
  from = "/forms/*"
  to = "/new-patients.html"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us/*"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/wp-content/uploads/2017/10/Patient-Information-Form.pdf"
  to = "/assets/forms/patient-information-form.pdf"
  status = 301

[[redirects]]
  from = "/wp-content/uploads/2017/10/Authorization-Release-of-Information.pdf"
  to = "/assets/forms/authorization-release-of-information.pdf"
  status = 301

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
