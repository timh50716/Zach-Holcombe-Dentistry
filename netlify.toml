# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

# No long-lived cache rule for /assets/*: Netlify's default (revalidate with ETag on every
# request) means updated images and video show up right away. CSS/JS URLs also carry a
# content hash (?v=...) added by tools/build.py.

# Keep build tooling and docs off the public site.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Old domain -> new domain. Takes effect once dentalasheville.com (and www) is added to this
# Netlify site as a domain alias. Old WordPress paths go to their new pages; everything else
# keeps its path. Must stay above the path-only rules below.
[[redirects]]
  from = "https://dentalasheville.com/about-us/*"
  to = "https://zacharysholcombe.com/about.html"
  status = 301
  force = true

[[redirects]]
  from = "https://dentalasheville.com/services/*"
  to = "https://zacharysholcombe.com/services.html"
  status = 301
  force = true

[[redirects]]
  from = "https://dentalasheville.com/forms/*"
  to = "https://zacharysholcombe.com/new-patients.html"
  status = 301
  force = true

[[redirects]]
  from = "https://dentalasheville.com/contact-us/*"
  to = "https://zacharysholcombe.com/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "https://dentalasheville.com/*"
  to = "https://zacharysholcombe.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dentalasheville.com/about-us/*"
  to = "https://zacharysholcombe.com/about.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dentalasheville.com/services/*"
  to = "https://zacharysholcombe.com/services.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dentalasheville.com/forms/*"
  to = "https://zacharysholcombe.com/new-patients.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dentalasheville.com/contact-us/*"
  to = "https://zacharysholcombe.com/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dentalasheville.com/*"
  to = "https://zacharysholcombe.com/:splat"
  status = 301
  force = true

# Old WordPress URLs from dentalasheville.com -> new pages (keeps search rankings and bookmarks).
[[redirects]]
  from = "/about-us/*"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/services/*"
  to = "/services.html"
  status = 301
  force = true

[[redirects]]
  from = "/forms/*"
  to = "/new-patients.html"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us/*"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/wp-content/uploads/2017/10/Patient-Information-Form.pdf"
  to = "/assets/forms/patient-information-form.pdf"
  status = 301

[[redirects]]
  from = "/wp-content/uploads/2017/10/Authorization-Release-of-Information.pdf"
  to = "/assets/forms/authorization-release-of-information.pdf"
  status = 301

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
